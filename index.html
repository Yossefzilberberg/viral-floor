setInterval(function(){ const now=Date.now(); let ch=false; Object.keys(state).forEach(id=>{ const s=state[id]; if(s.status!=='idle'&&now-s.ts>s.ttl){ s.status='idle'; s.target=''; ch=true; const n=nodes[id]; if(n)drawLabel(n);} }); if(ch){ buildBeams(); updateCounts(); } },2000);
let sb=null;
function setActorSilent(ev){ const id=ev.actor_id; if(!ROSTER[id])return; const now=Date.now(),age=now-new Date(ev.ts).getTime(); const ttl=(ev.ttl_seconds||90)*1000; const status=age>ttl?'idle':(ev.status||'work'); state[id]={status:status,target:status==='idle'?'':ev.target,key:ev.target_key,message:ev.message,ts:new Date(ev.ts).getTime(),ttl:ttl,parent:ev.parent_actor}; }
function initData(){ try{ sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{realtime:{params:{eventsPerSecond:5}}}); }catch(e){ console.warn('sb init',e); return; } sb.from('office_events').select('*').order('id',{ascending:false}).limit(60).then(function(res){ const data=res.data; if(!data)return; data.slice().reverse().forEach(setActorSilent); data.slice(0,8).reverse().forEach(function(ev){ if(ev.message||ev.status==='consult')pushFeed(ev); }); Object.values(nodes).forEach(drawLabel); buildBeams(); updateCounts(); }); sb.channel('office_live').on('postgres_changes',{event:'INSERT',schema:'public',table:'office_events'},function(p){ setActor(p.new); }).subscribe(); }
function ilNow(){ try{ const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jerusalem',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()); const g=t=>{const o=p.find(x=>x.type===t);return o?o.value:'';}; const wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}; let hr=parseInt(g('hour'),10); if(hr===24)hr=0; return {day:wd[g('weekday')],hour:hr,label:g('weekday')+' '+g('hour')+':'+g('minute')}; }catch(e){ return {day:0,hour:NaN,label:''}; } }
function officeOpen(){ const n=ilNow(); if(isNaN(n.hour)) return true; return OFFICE_DAYS.includes(n.day)&&n.hour>=OFFICE_START&&n.hour<OFFICE_END; }
let previewForced=false;
function ilClock(){ try{ return new Date().toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',weekday:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ilNow().label; } }
function refreshState(){ const open=officeOpen(); const pill=document.getElementById('statePill'),dot=document.getElementById('stateDot'),txt=document.getElementById('stateTxt'),closed=document.getElementById('closed'); document.getElementById('clock').textContent=ilClock(); if(open){ pill.className='pill'; dot.className='dot'; txt.textContent='LIVE · שעות משרד'; closed.style.display='none'; } else { pill.className='pill closed'; dot.className='dot off'; txt.textContent='מחוץ לשעות'; closed.style.display=previewForced?'none':'flex'; } }
document.getElementById('previewBtn').onclick=function(){ previewForced=true; refreshState(); };
setInterval(refreshState,15000); refreshState();
document.getElementById('mReal').onclick=function(){mode="real";document.getElementById('mReal').classList.add('on');document.getElementById('mShow').classList.remove('on');Object.values(nodes).forEach(drawLabel);};
document.getElementById('mShow').onclick=function(){mode="show";document.getElementById('mShow').classList.add('on');document.getElementById('mReal').classList.remove('on');Object.values(nodes).forEach(drawLabel);};
let tt=0;
function animate(){ requestAnimationFrame(animate); tt+=0.016;
  Object.keys(nodes).forEach(id=>{ const n=nodes[id]; const s=state[id]||{status:'idle'}; const col=STCOL[s.status]||STCOL.idle; n.ring.material.color.setHex(col); const on=(s.status==='work'||s.status==='consult'); const pulse=on?(0.5+0.5*Math.sin(tt*3+n.base.x)):0; n.ring.scale.setScalar(1+pulse*0.06); (n.fig.userData.glowMats||[]).forEach(function(m){ m.emissive.setHex(col); m.emissiveIntensity=on?(0.4+pulse*0.7):0.0; }); n.fig.position.y=on?Math.abs(Math.sin(tt*2+n.base.z))*0.12:0; (n.fig.userData.arms||[]).forEach(function(a,i){ a.rotation.x=on?Math.sin(tt*4+(i?Math.PI:0)+n.base.x)*0.5:0; }); });
  beams.forEach(function(b){ b.material.opacity=0.5+0.5*Math.abs(Math.sin(tt*2)); });
  scene.rotation.y=Math.sin(tt*0.05)*0.04; renderer.render(scene,cam);
}
animate();
if(window.supabase&&window.THREE){ initData(); } else { addEventListener('load',function(){ if(window.supabase)initData(); }); }
</script>
</body>
